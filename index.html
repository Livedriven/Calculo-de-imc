<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Calculador De Imc</title>
  <link href="css/style.css" rel="stylesheet"/>
</head>

<body>
  <header class="container-header">
    <h1>Calcule Aqui seu Indice de Massa corporal</h1>
  </header>
  <main class="container-main">
    <section class="container-img">
      <img src="img/fitness.jpeg" alt="Um casal com um estilo de vida saudavel e com um imc saudavel">
    </section>
    <section class="container-forms">
      <form>
        <label for="peso">Peso (kg)</label>
        <input type="text" id="peso" placeholder="Digite seu peso ex: 61.5">

        <label for="altura">Altura (m)</label>
        <input type="text" id="altura" placeholder="Digite sua altura ex: 1.70">

        <button id="calculaImc" type="submit"> Calcular </button>
      </form>
    </section>
  </main>
  <script type="module" src="script.js"></script>
</body>

</html>
